version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # The agent runtime is installed at ratified versions only
      # (tests/unit/agent-dependency-boundary.test.ts fails any other); moving it is a
      # deliberate ratification, never a routine bump.
      - dependency-name: "ai"
      - dependency-name: "@ai-sdk/*"
      - dependency-name: "workflow"
      - dependency-name: "@workflow/*"
      # Chart and diagram exports are visual and no test checks their output, so a
      # new major waits for a manual pass.
      - dependency-name: "@zumer/snapdom"
        update-types: ["version-update:semver-major"]
      # Above 2.3.7, keyboard selection in the Create Table dialog breaks and
      # CreateTableModal.test.tsx overflows the stack (CI hangs). A later version
      # goes in only after that dialog is driven by keyboard in a browser.
      - dependency-name: "@radix-ui/react-select"
        versions: [">2.3.7"]
      # Dialog and popover 1.3 don't work beside select 2.3.7: popover 1.3 alone
      # does not open inside a 1.1 dialog (ChannelsTab), and dialog 1.3 hangs the
      # component suite on a stack overflow. They move together with select.
      - dependency-name: "@radix-ui/react-dialog"
        versions: [">=1.2.0"]
      - dependency-name: "@radix-ui/react-popover"
        versions: [">=1.2.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
