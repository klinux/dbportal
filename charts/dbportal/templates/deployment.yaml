{{- /*
Zero-config bootstrap generates JWT_SECRET per pod on its own data volume, so
two replicas would sign sessions with different keys (intermittent 401s behind
the Service). Refuse the combination instead of shipping it broken.
*/}}
{{- if and (not (include "dbportal.authStrict" .)) (not .Values.secrets.jwtSecret) (not .Values.secrets.existingSecret) (or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1)) }}
{{- fail "zero-config bootstrap generates a per-pod JWT secret, which breaks sessions across replicas: with replicaCount > 1 or autoscaling.enabled, set secrets.jwtSecret (or secrets.existingSecret), or use config.authBootstrap=off" }}
{{- end }}
{{- /*
The seed ConfigMap is only rendered from inline config; with neither an
inline config nor an existing ConfigMap the pod would mount a ConfigMap
that does not exist and never start. Refuse the combination instead.
*/}}
{{- if and .Values.seedConnections.enabled (not .Values.seedConnections.config) (not .Values.seedConnections.existingConfigMap) }}
{{- fail "seedConnections.enabled requires either seedConnections.config (inline) or seedConnections.existingConfigMap - with neither, the pod would mount a ConfigMap that does not exist" }}
{{- end }}
{{- /*
The permission-fix init container needs root, which OpenShift's restricted-v2
SCC rejects - and where the SCC applies, the pod's UID/GID come from the
namespace range instead of podSecurityContext, so chowning to the configured
runAsUser/fsGroup would target the wrong owner anyway. Refuse the combination
rather than render a manifest that cannot work (#170).
*/}}
{{- /*
The agent's zero-config durable backend keeps run state in a directory on local
disk and takes file locks. Each pod mounts its own /app/data, so above one replica
a run started on one pod is simply not there when the browser's next request lands
on another - and on a shared RWX volume the locks contend instead. The only backend
that lifts this is @workflow/world-postgres, which the published image cannot load
at all (docs/BACKLOG.md B16), so this is refused rather than rendered broken (#331).
*/}}
{{- if and (include "dbportal.agentPossible" .) (include "dbportal.multiReplica" .) (not (include "dbportal.agentPostgresWorld" .)) }}
{{- fail "the agent runtime is single-instance: its zero-config ledger keeps run state on each pod's own disk behind file locks, so above one replica a run started on one pod is invisible to the next request. This release can run agents (an AI configuration is set in these values, or agent.enabled=true) and asks for more than one replica. Set replicaCount=1 (with autoscaling off) to keep the agent, or agent.enabled=false to run Studio on many replicas with no agent. The one backend that lifts the constraint, WORKFLOW_TARGET_WORLD=@workflow/world-postgres, is not loadable in the published container image today (B16 in docs/BACKLOG.md), so multi-replica agent runs are unsupported rather than merely unconfigured: set it (with WORKFLOW_POSTGRES_URL) through extraEnv only if image.repository points at an image that carries that world" }}
{{- end }}
{{- if and .Values.persistence.fixPermissions (include "dbportal.adaptOpenShiftSecurityContext" .) }}
{{- fail "persistence.fixPermissions cannot be combined with the OpenShift security-context adaptation: restricted-v2 rejects the root init container, and the pod's UID/GID come from the namespace range rather than podSecurityContext, so the chown would target the wrong owner. On OpenShift, use a storage class whose volumes the kubelet applies fsGroup to (or pre-chown the volume) and leave persistence.fixPermissions=false; set global.compatibility.openshift.adaptSecurityContext=disabled only if this is not an OpenShift cluster" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbportal.fullname" . }}
  labels:
    {{- include "dbportal.labels" . | nindent 4 }}
spec:
  {{- /* An HPA or a KEDA ScaledObject owns the count; a replicas line here would reset it on every upgrade. */}}
  {{- if not (or (include "dbportal.autoscalingEnabled" .) (and .Values.keda.enabled (not .Values.workers.enabled))) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dbportal.selectorLabels" . | nindent 6 }}
  {{- include "dbportal.podTemplate" (dict "root" . "role" .Values.role "labels" (include "dbportal.labels" .) "resources" .Values.resources "dataVolume" "shared") | nindent 2 }}
