{{- /*
Environment variables the operator hands over as a Secret rather than in the pod spec
(docs/CONTEXT.md §4.45): what the chart has no field for - METRICS_TOKEN,
STORAGE_ENCRYPTION_KEY, VAULT_TOKEN, a seed file's ${DB_PASSWORD}. Every role Deployment
attaches it with envFrom, and the pod template hashes it so a changed value rolls the pods.
Values are stringified and base64-encoded here, as the release's own Secret does.
*/}}
{{- if .Values.extraSecretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbportal.fullname" . }}-extra-env
  labels:
    {{- include "dbportal.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .Values.extraSecretEnv }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
